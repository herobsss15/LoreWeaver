[project]
name = "loreweaver-py"
version = "0.1.0"
description = "Python FastAPI implementation of the LoreWeaver domain"
requires-python = ">=3.11"
authors = [
  { name = "LoreWeaver Team" }
]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "SQLAlchemy>=2.0.30",
  "pydantic>=2.7.1",
  "pydantic-settings>=2.2.1",
  "alembic>=1.13.1",
  "pymysql>=1.1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.4.5"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
